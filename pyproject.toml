[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-diff"
version = "0.1.0"
description = "Multi-temporal satellite change detection pipeline from open Sentinel-2 data"
readme = "README.md"
authors = [{ name = "Onur Kutan" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24.0",
    "rasterio>=1.3.0",
    "pystac-client>=0.7.0",
    "planetary-computer>=1.0.0",
    "requests>=2.31.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "shapely>=2.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
sentinel-diff = "sentinel_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit rule set so lint results do not depend on the installed ruff version.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow unicode in docstrings/comments (e.g. "Δ", "→")
